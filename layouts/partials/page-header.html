{{/* Unified Page Header - Used by all non-homepage pages */}}
<header class="page-header-unified">
    <div class="container">
        <h1 class="page-title">{{ .Title }}</h1>
        {{ with .Description }}
        <p class="page-subtitle">{{ . }}</p>
        {{ end }}
    </div>
</header>

<style>
.page-header-unified {
  background: linear-gradient(180deg, rgba(26, 26, 46, 0.8) 0%, rgba(15, 15, 26, 0) 100%);
  padding: 4rem 0 2rem;
  margin-top: 80px; /* Account for fixed nav */
  border-bottom: 1px solid rgba(56, 189, 248, 0.1);
}

.page-header-unified .container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

.page-title {
  font-size: 2.5rem;
  font-weight: 700;
  margin: 0 0 0.75rem;
  background: linear-gradient(135deg, #38bdf8 0%, #00ADD8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: #38bdf8;
  line-height: 1.2;
}

.page-subtitle {
  font-size: 1.1rem;
  color: #888;
  margin: 0;
  line-height: 1.6;
  max-width: 800px;
}

@media (max-width: 768px) {
  .page-title {
    font-size: 2rem;
  }
  
  .page-subtitle {
    font-size: 1rem;
  }
}
</style>
