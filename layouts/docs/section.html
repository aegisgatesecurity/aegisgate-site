{{ define "main" }}
<header class="page-header">
        <div class="container">
            <h1>{{ .Title }}</h1>
            {{ with .Description }}<p class="description">{{ . }}</p>{{ end }}
        </div>
    </header>
    
    <div class="container">
        <div class="docs-layout">
            {{ partial "docs-sidebar.html" . }}
            <article class="docs-content">
                {{ .Content }}
            </article>
        </div>
    </div>
{{ end }}
