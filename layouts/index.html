{{ define "main" }}
<section id="pitch" class="hero">
        <div class="container">
            <h1>🛡️ {{ .Site.Title }}</h1>
            <p class="subtitle">{{ .Site.Params.description }}</p>
            
            <div class="badges">
                <img src="https://img.shields.io/github/v/tag/aegisgatesecurity/aegisgate-platform?label=Version" alt="Version">
                <img src="https://img.shields.io/badge/Go-{{ .Site.Params.goVersion }}-00ADD8?logo=go" alt="Go">
                <img src="https://img.shields.io/badge/Security-0_CVEs-brightgreen?logo=shield" alt="Security">
                <img src="https://img.shields.io/badge/Coverage-{{ .Site.Params.coverage }}-green?logo=codecov" alt="Coverage">
                <img src="https://img.shields.io/badge/Docker-{{ .Site.Params.dockerSize }}-2496ED?logo=docker" alt="Docker">
            </div>

            {{ .Content }}
        </div>
    </section>
{{ end }}
