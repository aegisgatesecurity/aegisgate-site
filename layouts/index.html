{{ define "main" }}
<section id="pitch" class="hero">
    <div class="container">
        <h1>🛡️ {{ .Site.Title }}</h1>
        
        {{ .Content }}
    </div>
</section>
{{ end }}

{{ define "scripts_extra" }}
    <!-- Homepage-only: show admin redirect banner for authenticated users -->
    {{ $redirect := resources.Get "js/home-redirect.js" }}
    {{ if $redirect }}
    <script src="{{ $redirect.RelPermalink }}"></script>
    {{ end }}
{{ end }}
