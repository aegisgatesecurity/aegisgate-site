<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — AegisGate{{ end }}</title>
    <meta name="description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    
    <!-- Open Graph -->
    <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — AegisGate{{ end }}">
    <meta property="og:description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:site_name" content="AegisGate">
    <meta property="og:image" content="{{ .Site.BaseURL }}og-image.png">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — AegisGate{{ end }}">
    <meta name="twitter:description" content="{{ if .Params.description }}{{ .Params.description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    
    <!-- Favicon -->
    <link rel="icon" href="{{ .Site.BaseURL }}favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="{{ .Site.BaseURL }}favicon.ico" type="image/x-icon">
    
    <!-- Styles -->
    <link rel="stylesheet" href="{{ .Site.BaseURL }}css/styles.css">
    
    <!-- Mermaid -->
    {{ if .Params.mermaid }}<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>{{ end }}
    
    <!-- Page-specific head -->
    {{ block "head" . }}{{ end }}
</head>
<body>
    {{ partial "nav.html" . }}
    
    <main>
        {{ block "main" . }}{{ end }}
    </main>
    
    {{ partial "footer.html" . }}
    
    {{ partial "scripts.html" . }}
    
    {{ block "scripts" . }}{{ end }}
</body>
</html>
