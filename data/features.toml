# AegisGate Features Configuration

[features.http_proxy]
name = "HTTP API Security"
icon = "🌐"
description = "Bidirectional scanning of every API request and response with 176 detection patterns"
items = [
  "176 detection patterns (MITRE ATLAS, OWASP LLM Top 10, PII/secrets)",
  "Bidirectional request/response scanning",
  "Real-time threat blocking",
  "Rate limiting per client/IP with token-bucket algorithm",
  "PII, secrets, credentials, and API key detection",
  "Circuit breaker for automatic failure recovery"
]

[features.mcp]
name = "MCP Protocol Protection"
icon = "🔗"
description = "Session authentication, tool authorization, and 8 guardrails for every MCP connection"
items = [
  "Session authentication + isolation",
  "Tool authorization with risk-based matrix",
  "8 MCP guardrails active",
  "STDIO validation (command injection prevention)",
  "MITRE ATLAS enforcement",
  "Concurrent session limits & per-client RPM"
]

[features.a2a]
name = "A2A Agent-to-Agent Security"
icon = "🤝"
description = "Zero-trust guardrails for inter-agent communication — the first purpose-built A2A security layer"
items = [
  "mTLS zero-trust authentication (X.509, CN = agent ID)",
  "HMAC-SHA256 integrity verification on every request",
  "Per-agent capability enforcement (least-privilege)",
  "Token-bucket rate limiting per agent",
  "Request size limits & timeout enforcement",
  "Prometheus metrics per guardrail"
]

[features.auth]
name = "Enterprise Authentication"
icon = "🔐"
description = "Production-grade SSO and access control — SAML 2.0, OIDC, OAuth 2.0 with PKCE"
items = [
  "OIDC / OAuth 2.0 with PKCE & auto-discovery",
  "SAML 2.0 SP-initiated login with audience restriction enforcement",
  "Pre-configured for Azure AD, Okta, Google Workspace",
  "Role-based access control (RBAC) with 4 user roles × 11 resources",
  "Scoped API tokens with per-token role, tier, and tenant isolation",
  "OIDC access token introspection (RFC 7662)",
  "Risk-weighted tool authorization matrix",
  "API key fallback for service accounts & CI/CD"
]

