name: Build and Deploy to Netlify (production)

# Triggers a Netlify production build on every push to main.
# Uses a Netlify build hook (configured in Netlify dashboard at
# Site settings → Build & deploy → Build hooks) which is stored
# as the NETLIFY_BUILD_HOOK secret in this repo's settings.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    # Allow manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Debug NETLIFY_BUILD_HOOK (diagnostic - DELETE after fix)
        env:
          SECRET_NAME: NETLIFY_BUILD_HOOK
        run: |
          echo "DIAGNOSTIC: this step exists only to debug the empty-secret issue. delete it after the fix."
          echo "  repo: aegisgatesecurity/aegisgate-site"
          echo "  workflow: deploy-production.yml"
          echo "  secret name: $SECRET_NAME"
          echo "  gh secret list confirms the secret exists; the workflow still fails with -z"
          echo "  fix: paste the actual Netlify build hook URL into https://github.com/aegisgatesecurity/aegisgate-site/settings/secrets/actions"
      - name: Trigger Netlify build
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set"
            echo "Create a build hook at https://app.netlify.com/sites/marvelous-fudge-db3a6f/settings/deploys#build-hooks"
            echo "and add it as a repository secret named NETLIFY_BUILD_HOOK"
            exit 1
          fi
          echo "Triggering Netlify build..."
          response=$(curl -s -X POST -w "\n%{http_code}" "$NETLIFY_BUILD_HOOK")
          http_code=$(echo "$response" | tail -n 1)
          if [ "$http_code" = "200" ]; then
            echo "Netlify build triggered successfully"
          else
            echo "::warning::Netlify returned HTTP $http_code"
            echo "$response" | head -n -1
          fi
