name: CI

# AegisGate Site CI — Build validation, link checking, and Lighthouse performance
#
# Runs on every push to main and every PR to main.
# Validates Hugo build, checks for broken links, runs Lighthouse audits.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job 1: Hugo Build Validation
  build:
    name: Hugo Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.9'
          extended: true

      - name: Build site
        run: |
          hugo --minify --baseURL https://aegisgatesecurity.io/
          echo "✅ Hugo build succeeded"
          echo "  Pages generated: $(find public -name '*.html' | wc -l)"
          echo "  Total size: $(du -sh public | cut -f1)"

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: public/
          retention-days: 7

  # Job 2: Link Check
  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.9'
          extended: true

      - name: Build site for checking
        run: hugo --minify --baseURL https://aegisgatesecurity.io/

      - name: Install link checker
        run: |
          npm install -g html-link-checker@1.0.3 2>/dev/null || true
          # Fallback: use lychee
          curl -sL https://github.com/lycheeverse/lychee/releases/download/v0.17.0/lychee-v0.17.0-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /usr/local/bin

      - name: Check internal links
        run: |
          echo "## Internal Link Check" >> $GITHUB_STEP_SUMMARY
          lychee --base public/ --include-fragments --no-progress public/ 2>&1 | tee link-results.txt || true
          # Check exit code
          if grep -q "✗.*Errors" link-results.txt 2>/dev/null; then
            echo "❌ Broken links found" >> $GITHUB_STEP_SUMMARY
            grep "✗" link-results.txt >> $GITHUB_STEP_SUMMARY || true
            exit 1
          else
            echo "✅ All links valid" >> $GITHUB_STEP_SUMMARY
          fi

  # Job 3: Lighthouse Audit
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.9'
          extended: true

      - name: Build site
        run: hugo --minify --baseURL https://aegisgatesecurity.io/

      - name: Serve site locally
        run: |
          npx -y serve public/ -p 1313 -s &
          sleep 5
          curl -s -o /dev/null -w "%{http_code}" http://localhost:1313/ | grep -q "200" && echo "Site serving on localhost:1313"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:1313/
            http://localhost:1313/docs/
            http://localhost:1313/docs/quickstart/
            http://localhost:1313/tech/
            http://localhost:1313/changelog/
          uploadArtifacts: true
          budgetPath: .lighthouse/budget.json
          configPath: .lighthouse/lighthouserc.json

      - name: Lighthouse Summary
        if: always()
        run: |
          echo "## 📊 Lighthouse Results" >> $GITHUB_STEP_SUMMARY
          if [ -d .lighthouseci ]; then
            for result in .lighthouseci/*/; do
              if [ -f "${result}manifest.json" ]; then
                echo "Results found in ${result}" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi
          echo "Check the uploaded Lighthouse artifacts for detailed scores." >> $GITHUB_STEP_SUMMARY

  # Job 4: HTML Validation
  html-validate:
    name: HTML Validation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.9'
          extended: true

      - name: Build site
        run: hugo --minify --baseURL https://aegisgatesecurity.io/

      - name: Validate HTML
        run: |
          npm install -g html-validate@v9
          html-validate public/ 2>&1 | tee html-validate-results.txt || true
          echo "## HTML Validation" >> $GITHUB_STEP_SUMMARY
          if grep -q "error" html-validate-results.txt 2>/dev/null; then
            echo "⚠️ HTML validation found errors (non-blocking)" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ HTML validation passed" >> $GITHUB_STEP_SUMMARY
          fi