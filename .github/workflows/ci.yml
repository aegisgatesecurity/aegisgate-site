name: CI

# AegisGate Site CI — Build validation, link checking, and Lighthouse performance
#
# Runs on every push to main and every PR to main.
# Validates Hugo build, checks for broken links, runs Lighthouse audits.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job 1: Hugo Build Validation
  build:
    name: Hugo Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.9'
          extended: true

      - name: Build site
        run: |
          hugo --minify --baseURL https://aegisgatesecurity.io/
          echo "✅ Hugo build succeeded"
          echo "  Pages generated: $(find public -name '*.html' | wc -l)"
          echo "  Total size: $(du -sh public | cut -f1)"

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: public/
          retention-days: 7

  # Job 2: Link Check (using lychee action)
  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.9'
          extended: true

      - name: Build site for checking
        run: hugo --minify --baseURL https://aegisgatesecurity.io/

      - name: Serve site locally
        run: |
          npx -y serve public/ -p 1313 -s -l tcp://127.0.0.1:1313 > /tmp/serve.log 2>&1 &
          # Wait for server to be ready (up to 30s)
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:1313/ 2>/dev/null | grep -q "200"; then
              echo "✅ Site serving on http://localhost:1313"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --base-url http://localhost:1313 --include-fragments --no-progress public/**/*.html
          fail: true
          jobSummary: true

  # Job 3: Lighthouse Audit
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.9'
          extended: true

      - name: Build site
        run: hugo --minify --baseURL https://aegisgatesecurity.io/

      - name: Serve site locally
        run: |
          npx -y serve public/ -p 1313 -s -l tcp://127.0.0.1:1313 > /tmp/serve.log 2>&1 &
          # Wait for server to be ready (up to 30s)
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:1313/ 2>/dev/null | grep -q "200"; then
              echo "✅ Site serving on http://localhost:1313"
              break
            fi
            echo "Waiting for server... ($i)"
            sleep 1
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:1313/
            http://localhost:1313/docs/
            http://localhost:1313/docs/quickstart/
            http://localhost:1313/tech/
            http://localhost:1313/changelog/
          uploadArtifacts: true
          budgetPath: .lighthouse/budget.json
          configPath: .lighthouse/lighthouserc.json

      - name: Lighthouse Summary
        if: always()
        run: |
          echo "## 📊 Lighthouse Results" >> $GITHUB_STEP_SUMMARY
          echo "Check the uploaded Lighthouse artifacts for detailed scores." >> $GITHUB_STEP_SUMMARY

  # Job 4: HTML Validation (advisory, non-blocking)
  html-validate:
    name: HTML Validation
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.9'
          extended: true

      - name: Build site (unminified for validation)
        run: hugo --baseURL https://aegisgatesecurity.io/

      - name: Validate HTML
        run: |
          npm install -g html-validate@v9
          html-validate public/ 2>&1 | tee html-validate-results.txt || true
          echo "## HTML Validation" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ HTML validation is advisory — Hugo minified output may trigger false positives." >> $GITHUB_STEP_SUMMARY
          echo "Results are non-blocking (continue-on-error: true)." >> $GITHUB_STEP_SUMMARY