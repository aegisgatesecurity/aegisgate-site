<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Manager | AegisGate Security Platform</title>
    <meta name="description" content="AegisGate Security Platform content management. For AegisGate Security, LLC staff only.">
    <meta name="robots" content="noindex, nofollow">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .sveltia-loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #555;
        }
        .sveltia-loader h1 {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .sveltia-loader p {
            font-size: 14px;
            color: #888;
        }
        .sveltia-loader .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #ddd;
            border-top-color: #00ADD8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .sveltia-error {
            position: fixed;
            top: 24px;
            left: 24px;
            right: 24px;
            max-width: 800px;
            margin: 0 auto;
            background: #fee;
            border: 1px solid #fcc;
            border-left: 4px solid #c00;
            border-radius: 6px;
            padding: 16px 20px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 13px;
            color: #600;
            z-index: 10000;
            display: none;
        }
        .sveltia-error.show { display: block; }
        .sveltia-error strong { color: #c00; }
        .sveltia-error pre {
            margin: 8px 0 0 0;
            padding: 8px;
            background: #fdd;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="sveltia-error" id="sveltia-error">
        <strong>Sveltia CMS failed to load.</strong>
        <span id="sveltia-error-message"></span>
        <pre id="sveltia-error-details"></pre>
    </div>

    <div class="sveltia-loader" id="sveltia-loader">
        <div class="spinner"></div>
        <h1>AegisGate Content Manager</h1>
        <p>Loading Sveltia CMS...</p>
    </div>

    <script>
        // ============================================
        // Error reporter — shows errors visibly on page
        // ============================================
        window.__sveltiaErrors = [];
        function reportError(title, message, details) {
            var errEl = document.getElementById('sveltia-error');
            var msgEl = document.getElementById('sveltia-error-message');
            var detEl = document.getElementById('sveltia-error-details');
            if (errEl && msgEl && detEl) {
                errEl.classList.add('show');
                msgEl.textContent = ' ' + (message || '');
                detEl.textContent = details || '';
            }
            window.__sveltiaErrors.push({title: title, message: message, details: details});
            console.error('[Sveltia Debug]', title, message, details || '');
        }
        window.addEventListener('error', function(event) {
            reportError(
                'JavaScript error',
                event.message,
                'File: ' + (event.filename || 'unknown') + '\n' +
                'Line: ' + (event.lineno || '?') + ':' + (event.colno || '?') + '\n' +
                'Error: ' + (event.error ? event.error.stack : 'unknown')
            );
        });
        window.addEventListener('unhandledrejection', function(event) {
            reportError(
                'Unhandled promise rejection',
                String(event.reason),
                event.reason && event.reason.stack ? event.reason.stack : ''
            );
        });
        document.addEventListener('securitypolicyviolation', function(event) {
            reportError(
                'Content Security Policy violation',
                'A CSP rule blocked a resource from loading.',
                'Blocked URI: ' + event.blockedURI + '\n' +
                'Violated directive: ' + event.violatedDirective
            );
        });
    </script>

    <!--
        Sveltia CMS — A modern, actively-maintained fork of Decap CMS (formerly Netlify CMS).
        Docs: https://sveltia.org/
        GitHub: https://github.com/sveltia/sveltia-cms

        IMPORTANT: Sveltia is a SELF-EXECUTING SCRIPT (not an ES module).
        From Sveltia's own source:
          "Sveltia CMS script is not an ES module. Remove the 'type=module'
           attribute from the <script> tag to avoid unexpected behavior when
           using the JavaScript API."

        The script auto-mounts the Svelte app to a DOM element on import.
        It reads config.yml from the same directory automatically.

        Authentication: We use Netlify Identity + Git Gateway (configured
        in config.yml). The netlify-identity-widget script below is the
        popup login UI that Sveltia uses to authenticate via Netlify.
    -->
    <!-- Netlify Identity widget — provides the login popup UI -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
        // Load Sveltia as a classic script (not ES module).
        // Sveltia will self-execute and mount the UI to the DOM.
        var script = document.createElement('script');
        script.src = 'https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js';
        script.onload = function() {
            // Sveltia has loaded. It should auto-initialize.
            // The "Loading..." spinner will be replaced by the Sveltia UI.
            // If we see this message in the error reporter, it means
            // Sveltia's auto-init is working.
            console.log('[Sveltia] Script loaded successfully');
        };
        script.onerror = function() {
            reportError(
                'Sveltia script failed to load',
                'The Sveltia CMS script could not be loaded from unpkg.com.',
                'URL: https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js\n\n' +
                'Common causes:\n' +
                '1. CSP blocking unpkg.com (check netlify.toml)\n' +
                '2. Network error (check internet connection)\n' +
                '3. unpkg.com is down (check https://status.unpkg.com)'
            );
            var loader = document.getElementById('sveltia-loader');
            if (loader) loader.style.display = 'none';
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
