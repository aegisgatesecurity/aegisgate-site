baseURL = "https://aegisgatesecurity.io/"
languageCode = "en-us"
title = "AegisGate Security Platform™ — Secure Every AI Interaction"
# theme = "aegisgate" (deprecated)

# Site params
[params]
  description = "The only AI security gateway with six pillars of AI security (HTTP API, MCP, A2A, ACP, RESPONSE, Trust Framework), MITRE ATLAS enforcement, the EU AI Act Compliance Module, and zero external dependencies. Deploy in 60 seconds."
  version = "v4.0.0"
  goVersion = "1.26.5+"
  dockerSize = "34.7MB"
  coverage = "87%+"
  github = "https://github.com/aegisgatesecurity/aegisgate-platform"
  twitter = "https://x.com/aegisgate"
  mastodon = "https://mastodon.social/@aegisgate"
  email = "security@aegisgatesecurity.io"
  salesEmail = "sales@aegisgatesecurity.io"
  copyrightStartYear = 2024
  currentYear = 2026

[params.social]
  github = "aegisgatesecurity"
  twitter = "aegisgate"
  mastodon = "https://mastodon.social/@aegisgate"

