baseURL = "https://aegisgatesecurity.io/"
languageCode = "en-us"
title = "AegisGate — Secure Every AI Interaction"
# theme = "aegisgate" (deprecated)

# Site params
[params]
  description = "Free browser protection (Lens), developer-grade local proxy (Rampart), and enterprise AI security gateway (Platform). Three products that secure every AI interaction — from ChatGPT to Copilot to custom LLMs. 100% open source."
  version = "v4.3.3"
  goVersion = "1.26.6"
  dockerSize = "19.1MB"
  coverage = "83.1%"
  github = "https://github.com/aegisgatesecurity/aegisgate-platform"
  twitter = "https://x.com/aegisgate"
  mastodon = "https://mastodon.social/@aegisgate"
  email = "security@aegisgatesecurity.io"
  salesEmail = "sales@aegisgatesecurity.io"
  copyrightStartYear = 2024
  currentYear = 2026

[params.social]
  github = "aegisgatesecurity"
  twitter = "aegisgate"
  mastodon = "https://mastodon.social/@aegisgate"

# Main nav menu — 3-product suite structure
[menu]
  [[menu.main]]
    name = "Lens"
    url = "/lens/"
    weight = 1

  [[menu.main]]
    name = "Rampart"
    url = "/rampart/"
    weight = 2

  [[menu.main]]
    name = "Platform"
    url = "/platform/"
    weight = 3

  [[menu.main]]
    name = "Docs"
    url = "/docs/"
    weight = 4

  [[menu.main]]
    name = "Pricing"
    url = "/pricing/"
    weight = 5

  [[menu.main]]
    name = "🚀 Live Demo"
    url = "https://demo.aegisgatesecurity.io/"
    weight = 6

  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 7

  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/aegisgatesecurity/aegisgate-platform"
    weight = 8
# Enable features
enableRobotsTXT = true
enableGitInfo = true

# Markdown config
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "dracula"
    lineNos = false
    noClasses = false
    guessSyntax = true

# Taxonomies (we only need tags for blog)
[taxonomies]
  tag = "tags"

# Deprecated theme - site overrides all theme files
# See themes/aegisgate-deprecated-20260803 for reference
theme = "aegisgate-deprecated-20260803"
