# Enable features
enableRobotsTXT = true
enableGitInfo = true

# Markdown config
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "dracula"
    lineNos = false
    noClasses = false
    guessSyntax = true

# Taxonomies (we only need tags for blog)
[taxonomies]
  tag = "tags"

# Deprecated theme - site overrides all theme files
# See themes/aegisgate-deprecated-20260803 for reference
theme = "aegisgate-deprecated-20260803"
