# Enable features
enableRobotsTXT = true
enableGitInfo = true

# Markdown config
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "dracula"
    lineNos = false

# Taxonomies (we only need tags for blog)
[taxonomies]
  tag = "tags"
  category = "categories"