# AegisGate Security Platform — Netlify Configuration
# =====================================================
#
# This file configures the Netlify deployment of aegisgatesecurity.io.
# Netlify reads this on every push to the connected branch (main).
#
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
# =================================================================

# =====================================================
# Build settings
# =====================================================
[build]
  # The Hugo command to run. We use --minify for production-optimized output.
  # --gc is "garbage collect" — removes unreferenced resources
  # --themesDir is explicit; Hugo's default is "./themes" which is correct
  command = "hugo --minify --gc"

  # The directory to publish. Hugo's default is "public/".
  publish = "public"

  # Environment variables for the build
  [build.environment]
    # Pin Hugo version for reproducible builds. Matches the version we use
    # locally (Hugo 0.123.7+extended).
    HUGO_VERSION = "0.123.7"
    # Tell Hugo we're on Netlify (affects baseURL behavior in some templates)
    HUGO_ENV = "production"

# =====================================================
# Deploy context settings
# =====================================================
# Production deploys (from main branch) use the production domain.
# Branch deploys (from feature branches) get a unique URL like
# https://branch-name--aegisgate-site.netlify.app for preview.

[context.production]
  command = "hugo --minify --gc"

[context.deploy-preview]
  command = "hugo --minify --gc --buildFuture --buildDrafts"

[context.branch-deploy]
  command = "hugo --minify --gc --buildFuture --buildDrafts"

# =====================================================
# Security Headers (applied to all deployments)
# =====================================================
# See: https://docs.netlify.com/routing/headers/

[[headers]]
  # Apply to all paths (catch-all for the entire site)
  for = "/*"
    # Security Headers
    # ---------------

    # Content Security Policy
    # -----------------------
    # This CSP is a "strict" policy that allows only the resources needed
    # by the site. When adding new external services, add their domains
    # to the appropriate directive below.
    #
    # Directives used:
    #   default-src      - Fallback for any directive not explicitly listed
    #   script-src       - JavaScript sources (Hugo, Mermaid, Stripe, Sveltia)
    #                     Sveltia is a CLASSIC script, not an ES module
    #                     (it self-executes on import), so 'unsafe-eval'
    #                     is not needed
    #   style-src        - CSS sources (Stripe injects inline styles)
    #   img-src          - Image sources (shields.io badges, Stripe images)
    #   font-src         - Web font sources
    #   connect-src      - XHR/fetch/WebSocket targets (Stripe API, Sveltia)
    #   frame-src        - iframe sources (Stripe checkout widget)
    #   frame-ancestors  - Who can embed us (replaces X-Frame-Options)
    #   worker-src       - Web worker sources (Sveltia uses web workers)
    #
    # Notes:
    #   - 'unsafe-inline' on style-src is required by Stripe Buy Button
    #     widget which injects inline styles
    #   - 'unsafe-inline' on script-src is required for Hugo's inline
    #     Mermaid initialization script
    #   - https://api.netlify.com is required for Sveltia CMS (uses
    #     Netlify Identity / Git Gateway API for authentication)
    #   - https://*.github.com is required for Sveltia's GitHub backend
    #   - https://unpkg.com is required for Sveltia's CDN-hosted bundle
    #   - blob: is required for Sveltia's dynamic web worker imports
    #   - https://fonts.googleapis.com and https://fonts.gstatic.com are
    #     required for Sveltia's Material Symbols Outlined font (used for
    #     icons in the Sveltia UI). Without these, the CSP blocks the
    #     stylesheet and Sveltia's icon font doesn't load.
    [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://js.stripe.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://js.stripe.com https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://js.stripe.com https://fonts.googleapis.com; img-src 'self' data: https: https://*.stripe.com https://avatars.githubusercontent.com; font-src 'self' data: https://js.stripe.com https://fonts.gstatic.com; connect-src 'self' https://api.stripe.com https://m.stripe.network https://api.netlify.com https://*.netlify.app https://*.github.com https://unpkg.com; frame-src 'self' https://checkout.stripe.com https://js.stripe.com; worker-src 'self' blob:; frame-ancestors 'none';"
    # frame-ancestors replaces X-Frame-Options (modern equivalent) and is recognized by all current browsers.

    # 2. X-Content-Type-Options
    X-Content-Type-Options = "nosniff"

    # 3. X-Frame-Options
    X-Frame-Options = "DENY"

    # 4. X-XSS-Protection
    X-XSS-Protection = "1; mode=block"

    # 5. Referrer-Policy
    Referrer-Policy = "strict-origin-when-cross-origin"

    # 6. Permissions-Policy
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  # Apply to sensitive paths (legal pages)
  for = "/legal/*"
    [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  # Static assets - allow caching
  for = "/*.{js,css,png,jpg,jpeg,gif,ico,svg,woff,woff2,ttf}"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # HTML - no caching
  for = "/*.html"
    [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
